{% extends "base.html" %}

{% block title %}

Page Not Found

{% endblock %}


{% block content %}

<div class="error-page">

    <div class="error-box">

        <h1>
            404
        </h1>

        <h2>
            Page Not Found
        </h2>

        <p>
            The page you are looking for
            does not exist.
        </p>

        <a
            href="{{ url_for('home') }}"
            class="primary-button">

            Go Home

        </a>

    </div>

</div>

{% endblock %}
