{% if movie['movie_file'] %}

<div class="video-section">

    <h2>▶ Watch Movie</h2>

    <div class="video-container">

        <video
            class="video-player"
            controls
            preload="metadata"
        >

            <source
                src="{{ url_for(
                    'serve_video',
                    filename=movie['movie_file']
                ) }}"
                type="video/mp4"
            >

            Your browser does not support video playback.

        </video>

    </div>

</div>

{% else %}

<p>No movie file has been uploaded.</p>

{% endif %}
