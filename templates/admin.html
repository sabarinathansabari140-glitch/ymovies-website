<form
    method="POST"
    action="{{ url_for('add_movie') }}"
    enctype="multipart/form-data"
>

    <input
        type="text"
        name="title"
        placeholder="Movie title"
        required
    >

    <input
        type="text"
        name="year"
        placeholder="Year"
    >

    <input
        type="text"
        name="genre"
        placeholder="Genre"
    >

    <textarea
        name="description"
        placeholder="Movie description"
    ></textarea>

    <label>Poster</label>

    <input
        type="file"
        name="poster"
        accept=".jpg,.jpeg,.png,.webp"
    >

    <label>Movie</label>

    <input
        type="file"
        name="movie_file"
        accept=".mp4,.webm,.ogg,.m4v"
    >

    <button
        type="submit"
        class="add-button"
    >
        🎬 Add Movie
    </button>

</form>
