<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin Login - MyMovies</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>


<body>


<header class="navbar">

    <a
        href="{{ url_for('home') }}"
        class="logo"
    >
        🎬 MyMovies
    </a>


    <nav>

        <a href="{{ url_for('home') }}">
            🏠 Home
        </a>

    </nav>

</header>



<main class="login-page">

    <div class="login-card">


        <div class="login-icon">
            🔐
        </div>


        <h1>
            Admin Login
        </h1>


        <p>
            Sign in to manage your movies
        </p>


        {% if error %}

        <div class="error-message">
            {{ error }}
        </div>

        {% endif %}


        <form
            method="POST"
            action="{{ url_for('login') }}"
        >


            <label>
                Username
            </label>

            <input
                type="text"
                name="username"
                placeholder="Username"
                autocomplete="username"
                required
            >


            <label>
                Password
            </label>

            <input
                type="password"
                name="password"
                placeholder="Password"
                autocomplete="current-password"
                required
            >


            <button
                type="submit"
                class="login-button"
            >
                🔑 Login
            </button>


        </form>


        <a
            href="{{ url_for('home') }}"
            class="back-link"
        >
            ← Back to Home
        </a>


    </div>

</main>



<footer>

    <p>
        © 2026 MyMovies
    </p>

</footer>


</body>
</html>
