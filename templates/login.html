<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin Login - MyMovies</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>

<body>

<header class="navbar">

    <div class="logo">
        🎬 MyMovies
    </div>

    <nav>

        <a href="{{ url_for('home') }}">
            Home
        </a>

    </nav>

</header>


<main class="login-container">

    <div class="login-card">

        <div class="login-icon">
            🔐
        </div>

        <h1>
            Admin Login
        </h1>

        <p class="login-subtitle">
            Sign in to manage your movies
        </p>


        {% if error %}

        <div class="error-message">
            {{ error }}
        </div>

        {% endif %}


        <form
            method="POST"
            action="{{ url_for('login') }}"
        >

            <label for="username">
                Username
            </label>

            <input
                id="username"
                type="text"
                name="username"
                placeholder="Enter username"
                required
                autocomplete="username"
            >


            <label for="password">
                Password
            </label>

            <input
                id="password"
                type="password"
                name="password"
                placeholder="Enter password"
                required
                autocomplete="current-password"
            >


            <button
                type="submit"
                class="login-button"
            >
                🔑 Login
            </button>

        </form>


        <a
            href="{{ url_for('home') }}"
            class="back-home"
        >
            ← Back to Home
        </a>

    </div>

</main>


<footer>

    <p>
        © 2026 MyMovies
    </p>

</footer>

</body>

</html>
